
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的HTML图库</title>
    <!-- 顶部左上角图标 (Favicon) -->
    <!-- 请确保根目录下有 favicon.ico 文件，或者修改 href 为实际图标路径 -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <header>
        <h1>图片展示库</h1>
        <p>以下是使用纯 HTML 标签构建的图片列表，包含图片注释。</p>
    </header>

    <main>
        <!-- 图片 1 -->
        <figure>
            <img src="https://picsum.photos/600/400?random=1" alt="一张风景照片，展示了山脉和湖泊" width="600" height="400">
            <figcaption>图1：宁静的山湖景色 - 拍摄于2023年夏季</figcaption>
        </figure>

        <hr>

        <!-- 图片 2 -->
        <figure>
            <img src="https://picsum.photos/600/400?random=2" alt="一张城市建筑照片，现代高楼大厦" width="600" height="400">
            <figcaption>图2：现代城市天际线 - 商业中心区</figcaption>
        </figure>

        <hr>

        <!-- 图片 3 -->
        <figure>
            <img src="https://picsum.photos/600/400?random=3" alt="一张动物照片，一只在草地上休息的金毛犬" width="600" height="400">
            <figcaption>图3：可爱的金毛寻回犬 - 公园午后时光</figcaption>
        </figure>
        
        <hr>

        <!-- 图片 4 -->
        <figure>
            <img src="https://picsum.photos/600/400?random=4" alt="一张美食照片，盘子里的意大利面" width="600" height="400">
            <figcaption>图4：自制番茄罗勒意大利面</figcaption>
        </figure>
    </main>

    <footer>
        <p>版权所有 &copy; 2026 纯HTML图库示例</p>
    </footer>

</body>
</html>
